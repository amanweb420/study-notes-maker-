<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Study Notes Maker</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#eef3f8;
color:#17202a;
font-family:Arial,"Noto Sans Devanagari",sans-serif
}

header{
background:linear-gradient(135deg,#1976d2,#5e35b1);
color:white;
padding:22px 15px;
text-align:center
}

header h1{
margin:0;
font-size:29px
}

header p{
margin:8px 0 0
}

.container{
max-width:900px;
margin:auto;
padding:12px
}

.card{
background:white;
border-radius:18px;
padding:17px;
margin:13px 0;
box-shadow:0 5px 18px #0001
}

h2{
margin:0 0 10px
}

input,textarea{
width:100%;
padding:12px;
border:1px solid #bbb;
border-radius:10px;
font-size:16px;
margin:5px 0 10px
}

textarea{
height:130px;
min-height:130px;
overflow-y:hidden;
resize:vertical
}

textarea:focus{
outline:2px solid #90caf9
}

button{
border:0;
border-radius:10px;
padding:11px 14px;
margin:4px;
background:#1976d2;
color:white;
font-size:15px;
cursor:pointer
}

button.green{
background:#2e7d32
}

button.gray{
background:#546e7a
}

button.orange{
background:#ef6c00
}

button.red{
background:#c62828
}

.row{
display:flex;
gap:8px;
flex-wrap:wrap
}
